<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blackjack: Ultimate God Mode</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:'Cinzel', serif;
  background:#02140a;
  color:white;
  overflow:hidden;
}

/* Gold particles background */
body::before{
  content:"";
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at 20% 30%, rgba(255,215,0,0.08) 0%, transparent 40%),
    radial-gradient(circle at 80% 70%, rgba(255,215,0,0.08) 0%, transparent 40%);
  z-index:-1;
}

/* Table */
#table{
  position:absolute;
  bottom:0;
  width:100%;
  height:80vh;
  background:radial-gradient(circle at center,#0b5d2a 0%,#063818 70%);
  border-top:4px solid gold;
  border-radius:200px 200px 0 0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:space-between;
  padding:20px;
  box-shadow:0 0 60px black inset;
}

/* Hands */
.hand{
  display:flex;
  gap:15px;
  perspective:1000px;
}

/* Cards */
.card{
  width:90px;
  height:130px;
  position:relative;
  transform-style:preserve-3d;
  transition:transform .8s;
}
.card.flip{transform:rotateY(180deg);}
.card-face{
  position:absolute;
  width:100%;
  height:100%;
  backface-visibility:hidden;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
}
.front{background:white;color:black;}
.back{background:#111;transform:rotateY(180deg);}

/* Chips */
#chips{
  display:flex;
  gap:15px;
}
.chip{
  width:60px;height:60px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-weight:bold;cursor:pointer;transition:.3s;
}
.chip:hover{transform:scale(1.1);}
.red{background:#b30000;}
.blue{background:#0044cc;}
.green{background:#008000;}
.black{background:#111;}

/* HUD */
#hud{position:absolute;top:20px;left:20px;}
#jackpot{position:absolute;top:20px;right:20px;color:gold;font-size:20px;}
#vip{position:absolute;top:60px;left:20px;color:gold;font-size:20px;}

/* Jackpot wheel overlay */
#jackpotWheel{
  position:fixed;inset:0;
  display:flex;justify-content:center;align-items:center;
  background:rgba(0,0,0,0.9);
  z-index:999;
  display:none;
}
#wheel{
  width:300px;height:300px;border-radius:50%;
  border:10px solid gold;
  background:conic-gradient(gold 0deg 90deg,#222 90deg 180deg,gold 180deg 270deg,#222 270deg 360deg);
  transition:transform 4s cubic-bezier(.17,.67,.15,.99);
}
</style>
</head>

<body>

<!-- HUD -->
<div id="hud">
  Money: $<span id="money">1000</span><br>
  VIP: <span id="vip">Bronze</span>
</div>
<div id="jackpot">
  Progressive Jackpot: $<span id="jackpotAmount">5000</span>
</div>

<!-- Table -->
<div id="table">
  <div>
    <h2>Dealer</h2>
    <div class="hand" id="dealer-hand"></div>
  </div>

  <div>
    <h2>You</h2>
    <div class="hand" id="player-hand"></div>
  </div>

  <div id="chips">
    <div class="chip red" onclick="placeBet(5)">$5</div>
    <div class="chip blue" onclick="placeBet(25)">$25</div>
    <div class="chip green" onclick="placeBet(100)">$100</div>
    <div class="chip black" onclick="placeBet(500)">$500</div>
  </div>

  <div>
    <button onclick="startRound()">Deal</button>
    <button onclick="hit()">Hit</button>
    <button onclick="stand()">Stand</button>
  </div>
</div>

<!-- Jackpot Wheel -->
<div id="jackpotWheel">
  <div id="wheel"></div>
</div>

<!-- Audio -->
<audio id="hitSound" src="hit.mp3"></audio>
<audio id="winSound" src="win.mp3"></audio>
<audio id="jackpotSound" src="jackpot.mp3"></audio>
<audio id="ambience" loop src="casino-ambience.mp3"></audio>

<script>
// 💰 Core Game Variables
let money=1000,jackpot=5000,currentBet=0;
let deck=[],playerHand=[],dealerHand=[],gameActive=false;
let hitSoft17=true;

// 💾 Auto Save
function saveGame(){localStorage.setItem("blackjackSave",JSON.stringify({money,jackpot,vip:document.getElementById("vip").textContent}));}
function loadGame(){let data=localStorage.getItem("blackjackSave");if(data){let s=JSON.parse(data);money=s.money;jackpot=s.jackpot;document.getElementById("vip").textContent=s.vip;updateUI();}}
loadGame();

// 🎵 Sound helper
function playSound(type){if(type==="hit")document.getElementById("hitSound").play();if(type==="win")document.getElementById("winSound").play();if(type==="jackpot")document.getElementById("jackpotSound").play();}

// 🃏 Deck System
const suits=["♠","♥","♦","♣"];
const values=[{name:"A",val:11},{name:"2",val:2},{name:"3",val:3},{name:"4",val:4},{name:"5",val:5},{name:"6",val:6},{name:"7",val:7},{name:"8",val:8},{name:"9",val:9},{name:"10",val:10},{name:"J",val:10},{name:"Q",val:10},{name:"K",val:10}];
function buildDeck(){deck=[];for(let s of suits){for(let v of values){deck.push({suit:s,name:v.name,value:v.val});}}shuffle(deck);}
function shuffle(array){for(let i=array.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[array[i],array[j]]=[array[j],array[i]];}}
function drawCard(){return deck.pop();}

// 🧮 Hand Value
function getHandValue(hand){let total=0,aces=0;for(let c of hand){total+=c.value;if(c.name==="A")aces++;}while(total>21&&aces>0){total-=10;aces--;}return total;}

// 🖼️ Render Cards
function renderHand(hand,id,hideFirst=false){const container=document.getElementById(id);container.innerHTML="";hand.forEach((card,i)=>{const cd=document.createElement("div");cd.className="card";const f=document.createElement("div");f.className="card-face front";f.textContent=(hideFirst&&i===0)?"":card.name+card.suit;const b=document.createElement("div");b.className="card-face back";cd.appendChild(f);cd.appendChild(b);if(!hideFirst||i!==0){setTimeout(()=>cd.classList.add("flip"),100);}container.appendChild(cd);});}

// 💰 Betting
function placeBet(a){if(gameActive)return;if(money>=a){currentBet+=a;money-=a;jackpot+=a*0.05;updateUI();}}

// 🎮 Game Flow
function startRound(){if(currentBet===0||gameActive)return;gameActive=true;buildDeck();playerHand=[];dealerHand=[];playerHand.push(drawCard());dealerHand.push(drawCard());playerHand.push(drawCard());dealerHand.push(drawCard());renderHand(playerHand,"player-hand");renderHand(dealerHand,"dealer-hand",true);checkBlackjack();playSound("hit");}
function checkBlackjack(){let p=getHandValue(playerHand);if(p===21)endGame();}

// 🎯 Player Actions
function hit(){if(!gameActive)return;playerHand.push(drawCard());renderHand(playerHand,"player-hand");playSound("hit");if(getHandValue(playerHand)>21)endGame();}
function stand(){dealerTurn();}

// 🧠 Dealer AI
function dealerTurn(){renderHand(dealerHand,"dealer-hand",false);let interval=setInterval(()=>{let total=getHandValue(dealerHand);let soft=isSoft(dealerHand);if(total<17||(hitSoft17&&total===17&&soft)){dealerHand.push(drawCard());renderHand(dealerHand,"dealer-hand");playSound("hit");}else{clearInterval(interval);endGame();}},800);}
function isSoft(hand){let total=0,aces=0;for(let c of hand){total+=c.value;if(c.name==="A")aces++;}return aces>0&&total<=21;}

// 🏁 End Game
function endGame(){gameActive=false;let p=getHandValue(playerHand),d=getHandValue(dealerHand);renderHand(dealerHand,"dealer-hand",false);if(p>21){}else if(d>21||p>d)winPayout(p===21&&playerHand.length===2);else if(p===d)money+=currentBet;currentBet=0;updateUI();saveGame();}
function winPayout(blackjack){money+=blackjack?currentBet*2.5:currentBet*2;jackpotTrigger();playSound("win");}

// 🎡 Jackpot
function jackpotTrigger(){if(Math.random()<0.05){spinWheel();}}
function spinWheel(){const w=document.getElementById("wheel");document.getElementById("jackpotWheel").style.display="flex";let amt=3600+Math.floor(Math.random()*360);w.style.transform="rotate("+amt+"deg)";setTimeout(()=>{money+=jackpot;jackpot=5000;updateUI();document.getElementById("jackpotWheel").style.display="none";playSound("jackpot");},4000);}

// UI
function updateUI(){document.getElementById("money").textContent=Math.floor(money);document.getElementById("jackpotAmount").textContent=Math.floor(jackpot);}
</script>

</body>
</html>
